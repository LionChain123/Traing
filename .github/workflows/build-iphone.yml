name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ShoulderBack/**'
      - 'ShoulderBack.xcodeproj/**'
      - 'scripts/build-iphone.sh'
      - 'tests/**'
      - '.github/workflows/build-iphone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iPhone app
        shell: bash
        run: bash scripts/build-iphone.sh

      - name: Download IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShoulderBack-iPhone-IPA
          path: artifacts/ShoulderBack-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-logs
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
